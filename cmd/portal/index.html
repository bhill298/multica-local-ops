<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multica dashboards</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<style>
:root{font-family:"Segoe UI",system-ui,sans-serif;color:#18352b;background:#f7f8f4;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:58rem;margin:8vh auto;padding:0 1.5rem}h1{font-size:clamp(2.3rem,6vw,3.8rem);letter-spacing:-.055em;margin:.3em 0}h2{font-size:1.28rem;margin:1.5em 0 .65em}a{color:#125c43}nav{display:flex;gap:1rem;flex-wrap:wrap;margin:2rem 0}nav a,button{background:white;border:1px solid #a6b6ab;border-radius:.4rem;padding:.65rem 1rem;color:#174935;text-decoration:none;font:inherit}nav a:hover,button:hover{background:#e5efe7}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}p{line-height:1.55}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;line-height:1.5}section{border-top:1px solid #bac8bd;padding:.8rem 0}.actions{display:flex;gap:.55rem;flex-wrap:wrap}td,th{padding:.4em .8em .4em 0;text-align:left;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}tr+tr{border-top:1px solid #dbe2da}
</style></head><body><main>
<h1>Multica dashboards</h1>
<nav aria-label="Dashboards"><a href="/user">Daily workspace</a><a href="/admin">VM administration</a><a href="/manage">Manage installation</a></nav>
<div id="manage" hidden><section><h2>Installation status</h2><p id="summary" role="status"></p><div id="details"></div></section>
<div id="controls" hidden><section><div class="actions"><button data-action="status">Refresh status</button><button data-action="start">Start VM</button><button data-action="restart">Restart VM</button><button data-action="stop">Shut down VM</button><button id="boot" hidden>Change startup</button></div></section>
<section><h2>Upstream updates</h2><div class="actions"><button data-action="check">Check for updates</button><button data-action="install">Install latest stable release</button></div>
<p><a href="https://github.com/multica-ai/multica/releases/latest" target="_blank" rel="noopener noreferrer">Read the latest release notes on GitHub</a></p>
<p>Updates use the VM checkpoint and export backup. Windows may ask for approval.</p></section></div>
<pre id="result" aria-live="polite"></pre></div>
</main><script src="/portal.js"></script></body></html>
