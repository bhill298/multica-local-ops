# Inside nginx's http context. Replace example names, addresses and TLS paths.
map_hash_bucket_size 128;
map $host $multica_upstream_host {
    default "";
    multica.example.net       multica.lan;
    multica-user.example.net  multica-user.lan;
    multica-admin.example.net multica-admin.lan;
}

# Translate only a matching HTTPS origin. Preserve missing Origin on GETs.
map "$host|$http_origin" $multica_origin {
    default "null";
    ~\|$ "";
    "multica.example.net|https://multica.example.net:8443"             http://multica.lan;
    "multica-user.example.net|https://multica-user.example.net:8443"   http://multica-user.lan;
    "multica-admin.example.net|https://multica-admin.example.net:8443" http://multica-admin.lan;
}

map $http_upgrade $multica_connection {
    default upgrade;
    ""      close;
}

server {
    listen 192.168.1.2:8443 ssl;
    server_name multica.example.net multica-user.example.net multica-admin.example.net;
    ssl_certificate     /home/pi/multica-tls/fullchain.pem;
    ssl_certificate_key /home/pi/multica-tls/privkey.pem;
    allow 192.168.1.0/24;
    # Optional WireGuard access. Substitute the VPN subnet or one peer's /32.
    # allow 10.77.0.0/24;
    deny all;
    if ($multica_upstream_host = "") { return 421; }

    location / {
        proxy_pass http://192.168.1.50:80;
        proxy_http_version 1.1;
        proxy_set_header Host $multica_upstream_host;
        proxy_set_header Origin $multica_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $multica_connection;
        proxy_buffering off;
        proxy_redirect http://multica.lan/       https://multica.example.net:8443/;
        proxy_redirect http://multica-user.lan/  https://multica-user.example.net:8443/;
        proxy_redirect http://multica-admin.lan/ https://multica-admin.example.net:8443/;
    }
}
