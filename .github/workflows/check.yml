name: Check local operations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test ./...
      - run: go vet ./...
      - run: node --test ./tests/office-fixture.test.mjs
      - shell: pwsh
        run: ./tests/installer.tests.ps1
      - shell: pwsh
        run: ./tests/disk-maintenance.tests.ps1
