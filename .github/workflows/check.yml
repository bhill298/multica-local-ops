name: Check local operations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: false # This module uses only the standard library and has no go.sum.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: go test ./...
      - run: go vet ./...
      - run: python -B -m unittest discover -s tests -p "test_*.py"
      - run: node --test ./tests/office-fixture.test.mjs
      - shell: pwsh
        run: ./tests/installer.tests.ps1
      - shell: pwsh
        run: ./tests/disk-maintenance.tests.ps1
